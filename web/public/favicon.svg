<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg_d1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow_d1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- App Badge Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bg_d1)" stroke="#334155" stroke-width="2" />

  <!-- Back Slide (Angled +7 deg, subtle depth) -->
  <rect x="15" y="8" width="41" height="31" rx="5" fill="#082035" stroke="#0284c7" stroke-width="1.8" transform="rotate(7 35 23)" />

  <!-- Front Slide (4:3 canvas) with drop shadow -->
  <rect x="9" y="15" width="45" height="34" rx="5.5" fill="#0c1a2d" stroke="#38bdf8" stroke-width="2.2" filter="url(#shadow_d1)" />

  <!-- High-contrast Eighth Note ♪ on the front slide -->
  <ellipse cx="23" cy="38" rx="6" ry="4.5" transform="rotate(-22 23 38)" fill="#38bdf8" />
  <line x1="28" y1="37" x2="28" y2="21" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <path d="M 28 21 C 36 21, 41 26, 39 30" stroke="#38bdf8" stroke-width="3.8" fill="none" stroke-linecap="round" />

  <!-- Subtle slide notation lines (representing 2 lines of lyrics/notes) -->
  <line x1="36" y1="36" x2="48" y2="36" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" />
  <line x1="36" y1="41" x2="45" y2="41" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
</svg>
