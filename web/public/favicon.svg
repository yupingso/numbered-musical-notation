  <!-- Front 4:3 Slide (Pure White) -->
  <rect x="2" y="7" width="26" height="20" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" />

  <!-- Large Bold Electric Blue Note ♪ -->
  <ellipse cx="10.5" cy="20.5" rx="3.8" ry="2.8" transform="rotate(-22 10.5 20.5)" fill="#0284c7" />
  <line x1="13.5" y1="20" x2="13.5" y2="10.5" stroke="#0284c7" stroke-width="2.6" stroke-linecap="round" />
  <path d="M 13.5 10.5 C 18.5 10.5, 21.5 13, 21 16" stroke="#0284c7" stroke-width="2.4" fill="none" stroke-linecap="round" />

  <!-- Blue accent bars -->
  <line x1="18" y1="20.5" x2="24" y2="20.5" stroke="#0ea5e9" stroke-width="1.5" stroke-linecap="round" />
  <line x1="18" y1="23.5" x2="22.5" y2="23.5" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
